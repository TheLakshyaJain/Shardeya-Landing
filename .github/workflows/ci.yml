name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build, ArchUnit, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (includes ArchUnit boundary tests)
        working-directory: backend
        run: mvn -B verify

  flyway-dry-run:
    name: Flyway migration dry-run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shardeya
          POSTGRES_USER: shardeya
          POSTGRES_PASSWORD: shardeya
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shardeya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate and apply migrations against a throwaway database
        working-directory: backend
        # flyway.locations points at the filesystem, not classpath:db/migration —
        # the classpath location resolves against target/classes, which is stale
        # or empty on a fresh checkout unless a compile/resource step runs first.
        # Filesystem always reflects the actual source files being reviewed.
        run: >
          mvn -B org.flywaydb:flyway-maven-plugin:migrate
          -Dflyway.locations=filesystem:src/main/resources/db/migration
          -Dflyway.url=jdbc:postgresql://localhost:5432/shardeya
          -Dflyway.user=shardeya
          -Dflyway.password=shardeya

  frontend:
    name: Frontend (lint, typecheck, unit tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run audit

  lighthouse:
    name: Lighthouse mobile budget (placeholder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Non-blocking until M10 (Polish, Performance & Hardening) defines the real
      # budgets.json against actual feature pages. See 00-ARCHITECTURE.md §6.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        continue-on-error: true
        with:
          staticDistDir: frontend/dist
          uploadArtifacts: true
          temporaryPublicStorage: true

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
      - name: Build whatsapp-stub image
        uses: docker/build-push-action@v6
        with:
          context: infra/whatsapp-stub
          push: false
